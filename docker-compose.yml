services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudapi:
    image: ghcr.io/trustattic/cloudapi:v0.0.9

  platform:
    image: ghcr.io/trustattic/platform:v2.0.0-RC2
    command: [ "api" ]
    depends_on:
      postgres:
        condition: service_healthy
      cloudapi:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_SOURCE: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      DB_MIGRATIONSDIR: "/var/run/ko/migrations"
      JOB_SERVICE: river
      JOB_DBSOURCE: postgres://coreapi:coreapi@postgres:5432/coreapi?sslmode=disable
      TOKENCIPHER_KEY: ""
      CONNECTIONCIPHER_KEY: ""
      TOKENIZER_0_KIND: paseto
      TOKENIZER_0_PUBLICKEY: ""
      TOKENIZER_1_KIND: jwt
      TOKENIZER_1_PUBLICKEY: ""
      ISSUER_KIND: paseto
      ISSUER_SECRETKEY: ""
      CLOUDAPI_URL: cloudapi:50051
      LOGLEVEL: debug

  platform-worker:
    image: ghcr.io/trustattic/platform:v2.0.0-RC2
    command: [ "worker" ]
    depends_on:
      postgres:
        condition: service_healthy
      platform:
        condition: service_started
      cloudapi:
        condition: service_started
    environment:
      DB_SOURCE: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      DB_MIGRATIONSDIR: "/var/run/ko/migrations"
      JOB_SERVICE: river
      JOB_DBSOURCE: postgres://coreapi:coreapi@postgres:5432/coreapi?sslmode=disable
      TOKENCIPHER_KEY: ""
      CONNECTIONCIPHER_KEY: ""
      TOKENIZER_0_KIND: paseto
      TOKENIZER_0_PUBLICKEY: ""
      TOKENIZER_1_KIND: jwt
      TOKENIZER_1_PUBLICKEY: ""
      ISSUER_KIND: paseto
      ISSUER_SECRETKEY: ""
      CLOUDAPI_URL: cloudapi:50051
      LOGLEVEL: debug

  riverui:
    image: ghcr.io/riverqueue/riverui:latest
    container_name: river
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: "postgres://platform:platform@postgres:5432/platform?sslmode=disable"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: ghcr.io/trustattic/ui:v2.0.0-alpha.14
    platform: linux/amd64
    container_name: ui
    pull_policy: always
    ports:
      - "3069:3069"
    environment:
      NUXT_API_URL: ""
      NUXT_SECRET_KEY: ""
      NUXT_SESSION_PASSWORD: ""
      NUXT_OAUTH_AUTH0_CLIENT_ID: ""
      NUXT_OAUTH_AUTH0_CLIENT_SECRET: ""
      NUXT_OAUTH_AUTH0_DOMAIN: ""
    depends_on:
      platform:
        condition: service_healthy
